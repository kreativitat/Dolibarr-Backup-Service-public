name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check public file boundaries
        run: python3 scripts/check_public_files.py
      - name: Scan all reachable history
        shell: bash
        run: |
          set -euo pipefail
          scanner_version=8.30.1
          scanner_archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${scanner_version}/gitleaks_${scanner_version}_linux_x64.tar.gz" \
            --output "${scanner_archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${scanner_archive}" | sha256sum --check
          tar -xzf "${scanner_archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --config .gitleaks.toml \
            --log-opts="--all --full-history" --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --redact=100 --no-banner
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check syntax and offline behavior
        run: |
          python3 -m py_compile backup.py logging_config.py test_backup.py test_cleanup.py scripts/check_public_files.py
          bash -n setup.sh
          python3 -m unittest discover -v
